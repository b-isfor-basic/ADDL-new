[tool.poetry]
name = "addl-app"
version = "0.1.0"
description = "Atlanta Doubles Dart League management application and player portal."
authors = ["b-isfor-basic <overt_link0m@icloud.com>"]
license = ""
readme = "README.md"
packages = [{include = "addl_app"}]

[tool.poetry.dependencies]
python = "^3.10"
Django = "^4.1.3"
django-extensions = "^3.2.1"
djangorestframework = "^3.14.0"
django-phonenumber-field = "^7.0.0"
phonenumbers = "^8.13.0"
django-recurrence = "^1.11.1"

[tool.poetry.group.dev.dependencies]
black = "^22.10.0"
pylint-django = "^2.5.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
