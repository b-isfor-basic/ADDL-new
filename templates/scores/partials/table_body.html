<tr class="bg-slate-700 text-slate-200 border-b border-slate-800 hover:bg-slate-700/50">
    <td class="p-2 text-sm text-center">{{ forloop.counter }}</td>
    {% if division|length > 1 %}
        <td class="p-2 text-sm text-center">{{ record.team__division }}</td>
    {% endif %}
    <td class="p-2 text-sm text-center">{% if record.player__first_name %}{{ record.player__first_name }} {{ record.player__last_name }}{% else %}{{ record.team }}{% endif %}</td>
    <td class="p-2 text-sm text-center">{{ stat }}</td>
</tr>
