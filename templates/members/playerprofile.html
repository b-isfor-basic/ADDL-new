{% extends 'base.html' %}

{% block content %}
{{ message }}

{% if user.is_authenticated %}
<div class="mt-24 text-slate-200">
    <h1>Logged in as {{ user.username }}</h1>
    <form id="logout-form" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</div>
{% endif %}

{% endblock content %}
