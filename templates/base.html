{% load compress %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />        
    <script>
      try {
        Typekit.load({ async: true });
      } catch (e) {}
    </script>
    <title>{% block title %}ADDL Portal{% endblock %}</title>
    <!--
      <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}"></link>
    -->
    {% compress css %}
    <link rel="stylesheet" href="{% static 'src/output.css' %}"></link>
    {% endcompress %}
    <link rel="stylesheet" href="https://use.typekit.net/ptc0kya.css"></link>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <symbol id="bullseye" viewBox="0 0 16 16">
        <title>ADDL</title>
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"></path>
        <path d="M8 13A5 5 0 1 1 8 3a5 5 0 0 1 0 10zm0 1A6 6 0 1 0 8 2a6 6 0 0 0 0 12z"></path>
        <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
        <path d="M9.5 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"></path>
      </symbol>
    </svg>
  </head>

  <body class="bg-indigo-50 flex flex-col min-h-screen">
    <nav class="bg-white flex w-full fixed-top">
      <div class="w-full m-5 grid grid-rows-1">
        <a class="tk-rig-solid-bold-inline inline-flex items-center" href="{% url 'home' %}">
        <svg width="40" height="40" fill="currentColor" class="bi mr-1 fill-indigo-600">
          <use xlink:href="#bullseye">
          </use>
          <span class="text-4xl">ADDL</span>
        </svg>
        </a>
        <div class="text-sm font-medium text-center text-gray-500 border-b border-gray-200 dark:text-gray-400 dark:border-gray-700">
          <ul class="flex flex-wrap -mb-px justify-evenly">
            <li class="mr-2">
                <a href="{% url 'home' %}" 
                {% if request.resolver_match.url_name == 'home' %}
                class="inline-block p-4 text-indigo-600 rounded-t-lg border-b-2 border-indigo-600 active dark:text-indigo-500 dark:border-indigo-500" aria-current="page"
                {% else %}
                class="inline-block p-4 rounded-t-lg border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300 dark:hover:text-gray-300"
                {% endif %}
                >Home</a>
            </li>
            <li class="mr-2">
                <a href="{% url 'all_areas' %}" 
                {% if request.resolver_match.url_name == 'all_areas' %}
                class="inline-block p-4 text-indigo-600 rounded-t-lg border-b-2 border-indigo-600 active dark:text-indigo-500 dark:border-indigo-500" aria-current="page"
                {% else %}
                class="inline-block p-4 rounded-t-lg border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300 dark:hover:text-gray-300"
                {% endif %}>Locations</a>
            </li>
            <li class="mr-2">
                <a href="#" class="inline-block p-4 rounded-t-lg border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300 dark:hover:text-gray-300">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-auto">
      {% block content %} 
      {% endblock %}
    </main>

    <div class="relative  block bg-indigo-900">
      <div class="text-center bg-dark tk-rustica p-2">
        <p class="text-white">Website Design by Brittney Smith</p>
        <p class="text-white">
          Copyright &copy; 2022 &middot; All Rights Reserved &middot;
          <a href="#" class="text-white">Contact Us</a>
        </p>
      </div>
    </div>
  </body>
</html>
