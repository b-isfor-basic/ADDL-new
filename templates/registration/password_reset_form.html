
<a href="{% url 'login' %}" class="inline-flex items-center text-primary-500 hover:underline">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
    <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
  </svg>
  <span class="align-middle">Back</span>
</a>

<form class="flex-row w-full justify-center items-center" id="password_reset" method="post" action="{% url 'password_reset' %}">
    <p class="p-2 text-gray-700 text-left">Forgot your password? Enter your email address below, and we’ll email instructions for setting a new one.</p>
    {% csrf_token %}
    <div class="w-full my-2 rounded-lg items-center justify-center bg-primary-100/20 border-primary-100 border shadow-violet-500/10 shadow-sm">
        <div class="flex items-center w-full">
            <div class="text-primary-500 px-2 items-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z" />
                    <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z" />
                </svg>              
            </div>
            <input type="text" name="email" id="id_email" class="appearance-none w-full bg-white outline-none border-none rounded-lg focus:ring-1 focus:ring-amber-400" placeholder="Email Address" required></input>
        </div>
      </div>
      <div class="flex items-end justify-center mt-6">
    <button hx-post="{% url 'password_reset' %}" hx-target="#password_reset" hx-swap="outerHTML" class="p-1 mx-4 mt-6 w-full bg-white rounded-lg text-primary font-semibold tk-rustica uppercase border border-primary-500 hover:transition-all hover:shadow-md hover:shadow-violet-500/20 hover:ease-in-out hover:duration-300 hover:bg-primary-100/20" type="submit">
          <span class="text-center text-primary-500">
            Reset Password
          </span>
        </button>
      </div>
    </form>
