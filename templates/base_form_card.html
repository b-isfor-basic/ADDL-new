{% block main %}
{% for formset in formsets %}
<div class="w-full p-4 justify-center align-center rounded-lg shadow-xl bg-slate-700/50 shadow-slate-900/40 border border-slate-900">
    <section class="md:grid md:grid-flow-col md:grid-cols-3 md:gap-3 w-full">
      <div class="md:col-span-1 border-b md:border-r md:border-b-0 border-slate-600">
        <h3 class="text-amber-500 text-2xl font-black place-self-start justify-start pb-2">{{ formset.title }}</h3>
        <div class="text-slate-400 text-sm space-y-3 p-1">
            {{ formset.description }}
        </div>
      </div>
      <div class="md:col-span-2">
        <div class="grid grid-cols-2 gap-3">
          {{ formset }}
        </div>
      </div>
    </section>
</div>
{% endblock main %}
