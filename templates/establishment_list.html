{% extends 'base.html' %}

{% block title %}Locations{% endblock %}

{% block content %}
<div class="md:max-w-screen-md">
  <div class="row-auto pb-4">
    <h1 class="tk-rustica font-black uppercase text-center text-5xl">Locations</h1>
  </div>
  <div class="flex flex-wrap justify-around">
    {% if all_areas %}
    {% for area in all_areas %}
    <div class="flex-auto m-2 p-2 pb-5 rounded-lg shadow-lg shadow-violet-500/50 bg-white">
      <p class="text-gray-700 text-base tk-objektiv-mk2 font-light uppercase">
        Area {{ area.number }}
      </p>
      <h5 class="text-gray-900 text-2xl leading-tight font-extrabold mb-2 tk-rustica">{{ area.name }}</h5>
      <p class="text-gray-700 text-base mb-4 tk-objektiv-mk2 font-light flex-wrap">
        {{ area.get_address }}
      </p>
      <div class="relative flex justify-center">
        <a href="{% url 'area' area.id %}">
          <button type="button" class="btn-outer">
            <span class="tk-objektiv btn-inner">
              More Info
            </span>
          </button>
        </a>
      </div>
    </div>
    {% endfor %}
    {% else %}
    <div class="justify-center">
      <p>No establishments found.</p>
    </div>
    {% endif %}
  </div>
</div>
  
{% endblock %}
